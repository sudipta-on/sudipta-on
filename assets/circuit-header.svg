<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sudipta Majumder. Animated quantum circuit banner." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#101c3d"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ee8fa"/>
    </linearGradient>
    <rect id="box" x="-17" y="-17" width="34" height="34" rx="6"/>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
      .g { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .pop { animation: pop 0.6s ease both; transform-origin: 0 0; }
      @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
      .meas { animation: meas 2.4s ease-in-out infinite; }
      @keyframes meas { 0%, 100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pop, .meas { animation: none; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#dots)"/>

  <!-- title block -->
  <text x="40" y="60" font-size="42" font-weight="800" fill="url(#ttl)">Sudipta Majumder</text>
  <text x="40" y="90" font-size="16" fill="#9fb3c8">Quantum optimization  ·  Quantum machine learning</text>
  <text class="mono" x="40" y="116" font-size="12.5" fill="#fbbf24">Ph.D. @ IIT Kharagpur  |  CSIR JRF  |  Qiskit Advocate (Tier 1)</text>

  <!-- wire labels -->
  <g class="mono" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="50" y="165">|0⟩</text><text x="50" y="200">|0⟩</text><text x="50" y="235">|0⟩</text><text x="50" y="270">|0⟩</text>
  </g>

  <!-- wires -->
  <g stroke="#2a3a5e" stroke-width="1.6">
    <line x1="80" y1="160" x2="840" y2="160"/>
    <line x1="80" y1="195" x2="840" y2="195"/>
    <line x1="80" y1="230" x2="840" y2="230"/>
    <line x1="80" y1="265" x2="840" y2="265"/>
  </g>

  <!-- CNOT connectors -->
  <g stroke="#a78bfa" stroke-width="1.8">
    <line x1="260" y1="160" x2="260" y2="195"/>
    <line x1="560" y1="160" x2="560" y2="265"/>
    <line x1="660" y1="230" x2="660" y2="265"/>
  </g>

  <!-- traveling pulses -->
  <g fill="#7ee8fa">
    <circle r="4"><animateMotion dur="6s" begin="0s"   repeatCount="indefinite" path="M80,160 L840,160"/></circle>
    <circle r="4"><animateMotion dur="6s" begin="1.2s" repeatCount="indefinite" path="M80,195 L840,195"/></circle>
    <circle r="4"><animateMotion dur="6s" begin="2.4s" repeatCount="indefinite" path="M80,230 L840,230"/></circle>
    <circle r="4"><animateMotion dur="6s" begin="3.6s" repeatCount="indefinite" path="M80,265 L840,265"/></circle>
  </g>

  <!-- q0 -->
  <g transform="translate(140,160)"><g class="pop" style="animation-delay:0.1s"><use href="#box" fill="#0d1a33" stroke="#22d3ee" stroke-width="1.8"/><text class="g" y="5" fill="#22d3ee">H</text></g></g>
  <g transform="translate(260,160)"><g class="pop" style="animation-delay:0.4s"><circle r="5.5" fill="#a78bfa"/></g></g>
  <g transform="translate(400,160)"><g class="pop" style="animation-delay:0.7s"><use href="#box" fill="#0d1a33" stroke="#fbbf24" stroke-width="1.8"/><text class="g" y="5" fill="#fbbf24">Rz</text></g></g>
  <g transform="translate(560,160)"><g class="pop" style="animation-delay:1.0s"><circle r="5.5" fill="#a78bfa"/></g></g>

  <!-- q1 -->
  <g transform="translate(140,195)"><g class="pop" style="animation-delay:0.2s"><use href="#box" fill="#0d1a33" stroke="#22d3ee" stroke-width="1.8"/><text class="g" y="5" fill="#22d3ee">H</text></g></g>
  <g transform="translate(260,195)"><g class="pop" style="animation-delay:0.4s"><circle r="11" fill="#0d1a33" stroke="#a78bfa" stroke-width="1.8"/><path d="M-11,0 H11 M0,-11 V11" stroke="#a78bfa" stroke-width="1.8"/></g></g>
  <g transform="translate(480,195)"><g class="pop" style="animation-delay:0.9s"><use href="#box" fill="#0d1a33" stroke="#fbbf24" stroke-width="1.8"/><text class="g" y="5" fill="#fbbf24">Rz</text></g></g>

  <!-- q2 -->
  <g transform="translate(140,230)"><g class="pop" style="animation-delay:0.3s"><use href="#box" fill="#0d1a33" stroke="#fbbf24" stroke-width="1.8"/><text class="g" y="5" fill="#fbbf24">Rx</text></g></g>
  <g transform="translate(400,230)"><g class="pop" style="animation-delay:0.8s"><use href="#box" fill="#0d1a33" stroke="#fbbf24" stroke-width="1.8"/><text class="g" y="5" fill="#fbbf24">Ry</text></g></g>
  <g transform="translate(660,230)"><g class="pop" style="animation-delay:1.2s"><circle r="5.5" fill="#a78bfa"/></g></g>

  <!-- q3 -->
  <g transform="translate(260,265)"><g class="pop" style="animation-delay:0.5s"><use href="#box" fill="#0d1a33" stroke="#fbbf24" stroke-width="1.8"/><text class="g" y="5" fill="#fbbf24">Rz</text></g></g>
  <g transform="translate(560,265)"><g class="pop" style="animation-delay:1.0s"><circle r="11" fill="#0d1a33" stroke="#a78bfa" stroke-width="1.8"/><path d="M-11,0 H11 M0,-11 V11" stroke="#a78bfa" stroke-width="1.8"/></g></g>
  <g transform="translate(660,265)"><g class="pop" style="animation-delay:1.2s"><circle r="11" fill="#0d1a33" stroke="#a78bfa" stroke-width="1.8"/><path d="M-11,0 H11 M0,-11 V11" stroke="#a78bfa" stroke-width="1.8"/></g></g>

  <!-- measurements -->
  <g transform="translate(790,160)"><g class="pop" style="animation-delay:1.5s"><use class="meas" href="#box" fill="#0d1a33" stroke="#f472b6" stroke-width="1.8"/><path d="M-10,7 A10,10 0 0 1 10,7" fill="none" stroke="#f472b6" stroke-width="1.6"/><path d="M0,7 L8,-8" stroke="#f472b6" stroke-width="1.6"/></g></g>
  <g transform="translate(790,195)"><g class="pop" style="animation-delay:1.6s"><use class="meas" href="#box" fill="#0d1a33" stroke="#f472b6" stroke-width="1.8"/><path d="M-10,7 A10,10 0 0 1 10,7" fill="none" stroke="#f472b6" stroke-width="1.6"/><path d="M0,7 L8,-8" stroke="#f472b6" stroke-width="1.6"/></g></g>
  <g transform="translate(790,230)"><g class="pop" style="animation-delay:1.7s"><use class="meas" href="#box" fill="#0d1a33" stroke="#f472b6" stroke-width="1.8"/><path d="M-10,7 A10,10 0 0 1 10,7" fill="none" stroke="#f472b6" stroke-width="1.6"/><path d="M0,7 L8,-8" stroke="#f472b6" stroke-width="1.6"/></g></g>
  <g transform="translate(790,265)"><g class="pop" style="animation-delay:1.8s"><use class="meas" href="#box" fill="#0d1a33" stroke="#f472b6" stroke-width="1.8"/><path d="M-10,7 A10,10 0 0 1 10,7" fill="none" stroke="#f472b6" stroke-width="1.6"/><path d="M0,7 L8,-8" stroke="#f472b6" stroke-width="1.6"/></g></g>
</svg>
